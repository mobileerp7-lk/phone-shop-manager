<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup wizard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.card{background:#fff;border:1px solid #D4D4D8;border-radius:12px;padding:12px}
.lbl{font-size:13px;color:#3F3F46;display:block;margin-bottom:4px;font-weight:500}
.inp{width:100%;box-sizing:border-box;height:44px;border:1px solid #A1A1AA;border-radius:8px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:#18181B}
.btn{height:48px;border:0;border-radius:10px;background:#1D4ED8;color:#fff;font:inherit;font-size:16px;font-weight:600;flex:1}
.btn2{height:48px;border:1px solid #1D4ED8;border-radius:10px;background:#fff;color:#1D4ED8;font:inherit;font-size:15px;font-weight:600;flex:1}
.muted{color:#52525B;font-size:13px}
.ph{background:#E4E4E7;border:1px dashed #A1A1AA;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#52525B;font-size:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.chk input{width:20px;height:20px;margin:0}
/* THEME: gradient + glass (shared by every screen) */
div[style*="width:390px"]{background:radial-gradient(120% 60% at 100% 0%,#C7D2FE 0%,rgba(199,210,254,0) 60%),radial-gradient(100% 50% at 0% 100%,#A5F3FC 0%,rgba(165,243,252,0) 60%),linear-gradient(160deg,#EEF2FF 0%,#F5F3FF 45%,#ECFEFF 100%) !important}
.bar,div[style*="background:#fff;border-bottom"],.tabs{background:rgba(255,255,255,.62) !important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.7) !important;box-shadow:0 1px 12px rgba(79,70,229,.08)}
.nav,div[style*="background:#fff;border-top"]{background:rgba(255,255,255,.7) !important;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-top:1px solid rgba(255,255,255,.8) !important;box-shadow:0 -4px 20px rgba(79,70,229,.08)}
.card,.item,.job,.po,.acc,.grp,.list,.tbl,.tile,.paper,.k div,.box,.not,.sync{background:rgba(255,255,255,.55) !important;backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.75) !important;box-shadow:0 8px 24px rgba(79,70,229,.10),inset 0 1px 0 rgba(255,255,255,.8);border-radius:16px !important}
.debt,.owe,.short,.note,.net,.ok{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px rgba(79,70,229,.08)}
.inp{background:rgba(255,255,255,.7) !important;border:1px solid rgba(99,102,241,.25) !important;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:#6366F1 !important;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.btn,.fab,.chipon,.act button.main{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#0891B2 100%) !important;color:#fff !important;border:0 !important;box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn2,.act button{background:rgba(255,255,255,.6) !important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(79,70,229,.45) !important;color:#3730A3 !important}
.chip{background:rgba(255,255,255,.6) !important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8) !important}
.chipon{border:0 !important}
.nav a.on,.tabs button.on{color:#4F46E5 !important}
.tabs button.on{border-bottom-color:#7C3AED !important}
.seg{background:rgba(255,255,255,.45) !important;backdrop-filter:blur(10px)}
.seg button.on{background:rgba(255,255,255,.9) !important}
a{color:#4338CA}
.ph{background:rgba(255,255,255,.45) !important;border:1px dashed rgba(79,70,229,.4) !important}
.ic,.av{background:linear-gradient(135deg,#C7D2FE,#A5F3FC) !important;color:#312E81 !important}
.tile svg{color:#6D28D9}
.bars span{background:linear-gradient(180deg,#7C3AED,#4F46E5) !important;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bars span.lo{background:linear-gradient(180deg,#C4B5FD,#A5B4FC) !important}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes glow{0%,100%{box-shadow:0 8px 20px rgba(79,70,229,.35)}50%{box-shadow:0 8px 30px rgba(124,58,237,.6)}}
.card,.item,.job,.po,.acc,.grp,.list,.tbl,.tile,.paper,.k div,.box,.debt,.owe,.net,.short{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.item:nth-child(2),.job:nth-child(2),.po:nth-child(2),.acc:nth-child(2),.k div:nth-child(2){animation-delay:.06s}
.item:nth-child(3),.job:nth-child(3),.po:nth-child(3),.acc:nth-child(3),.k div:nth-child(3){animation-delay:.12s}
.item:nth-child(4),.job:nth-child(4),.po:nth-child(4),.acc:nth-child(4),.k div:nth-child(4){animation-delay:.18s}
.item:nth-child(5),.job:nth-child(5),.po:nth-child(5),.acc:nth-child(5){animation-delay:.24s}
.item:nth-child(n+6),.job:nth-child(n+6),.po:nth-child(n+6){animation-delay:.3s}
.btn,.btn2,.chip,.tile,.fab,.act button,.nav a,.item,.job,.po,.acc,.p,.grp a{transition:transform .18s ease,box-shadow .18s ease,background .2s ease}
.btn:active,.btn2:active,.chip:active,.tile:active,.fab:active,.act button:active{transform:scale(.96)}
.item:hover,.job:hover,.po:hover,.acc:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(79,70,229,.18)}
.fab{animation:glow 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F5;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#18181B;display:flex;flex-direction:column;overflow:hidden">
<div style="padding:20px 16px 8px;background:#fff;border-bottom:1px solid #D4D4D8">
<div class="muted">Step 1 of 3</div>
<div style="font-size:22px;font-weight:700;margin-top:2px">Set up your shop</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px"><div style="height:4px;border-radius:2px;background:#1D4ED8"></div><div style="height:4px;border-radius:2px;background:#D4D4D8"></div><div style="height:4px;border-radius:2px;background:#D4D4D8"></div></div>
</div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div style="display:flex;gap:12px;align-items:center"><div class="ph" style="width:72px;height:72px">Logo</div><button class="btn2" style="flex:none;padding:0 16px;height:44px">Add shop logo</button></div>
<div><label class="lbl" for="s1">Shop name</label><input class="inp" id="s1" value="[Your Shop Name]"></div>
<div><label class="lbl" for="s2">Address</label><input class="inp" id="s2" value="[Street, City]"></div>
<div><label class="lbl" for="s3">Shop phone / WhatsApp</label><input class="inp" id="s3" value="[Phone number]"></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<div><label class="lbl" for="s4">Country</label><select class="inp" id="s4"><option>Sri Lanka</option></select></div>
<div><label class="lbl" for="s5">Currency</label><select class="inp" id="s5"><option>LKR - Sri Lankan Rupee</option><option>INR - Indian Rupee</option><option>USD - US Dollar</option><option>More currencies...</option></select></div>
</div>
<div class="card">
<div style="font-weight:600">Tax (GST / VAT)</div>
<label class="chk"><input type="checkbox">My shop charges tax on bills</label>
<div><label class="lbl" for="s6">Tax number (shown on bills)</label><input class="inp" id="s6" value=""></div>
</div>
<div class="card" style="display:flex;flex-direction:column;gap:6px"><div style="font-weight:600">Where should your data live?</div><label class="chk"><input type="radio" name="st" checked>On this phone, backed up to my Google Drive</label><label class="chk"><input type="radio" name="st">Online with my Supabase (several phones)</label><div class="muted">You can switch later without losing data.</div></div>
<div class="muted">Next steps: 2) pick your money accounts (cash, bank, wallet) and 3) pick ready-made product categories. Everything can be changed later in Settings.</div>
</div>
<div style="padding:12px 16px;background:#fff;border-top:1px solid #D4D4D8;display:flex;gap:8px"><button class="btn2">Skip for now</button><button class="btn">Next</button></div>
</div>
