body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.bar{height:56px;flex:none;background:#fff;border-bottom:1px solid #D4D4D8;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;font-size:18px;font-weight:600}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes glow{0%,100%{box-shadow:0 8px 20px rgba(79,70,229,.35)}50%{box-shadow:0 8px 30px rgba(124,58,237,.6)}}
.card,.item,.job,.po,.acc,.grp,.list,.tbl,.tile,.paper,.k div,.box,.debt,.owe,.net,.short{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.item:nth-child(2),.job:nth-child(2),.po:nth-child(2),.acc:nth-child(2),.k div:nth-child(2){animation-delay:.06s}
.item:nth-child(3),.job:nth-child(3),.po:nth-child(3),.acc:nth-child(3),.k div:nth-child(3){animation-delay:.12s}
.item:nth-child(4),.job:nth-child(4),.po:nth-child(4),.acc:nth-child(4),.k div:nth-child(4){animation-delay:.18s}
.item:nth-child(5),.job:nth-child(5),.po:nth-child(5),.acc:nth-child(5){animation-delay:.24s}
.item:nth-child(n+6),.job:nth-child(n+6),.po:nth-child(n+6){animation-delay:.3s}
.btn,.btn2,.chip,.tile,.fab,.act button,.nav a,.item,.job,.po,.acc,.p,.grp a{transition:transform .18s ease,box-shadow .18s ease,background .2s ease}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
