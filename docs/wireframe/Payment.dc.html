<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.bar{height:56px;flex:none;background:#fff;border-bottom:1px solid #D4D4D8;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;font-size:18px;font-weight:600}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#18181B}
.card{background:#fff;border:1px solid #D4D4D8;border-radius:12px;padding:12px}
.lbl{font-size:12px;color:#3F3F46;display:block;margin-bottom:3px;font-weight:500}
.inp{width:100%;box-sizing:border-box;height:44px;border:1px solid #A1A1AA;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;color:#18181B}
.btn{height:52px;border:0;border-radius:10px;background:#1D4ED8;color:#fff;font:inherit;font-size:17px;font-weight:700;flex:1}
.muted{color:#52525B;font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{font-size:12px;font-weight:700;color:#3F3F46;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 0}
.pay{display:grid;grid-template-columns:minmax(0,1fr) 130px 36px;gap:8px;align-items:end}
.x{width:36px;height:44px;border:0;background:none;color:#52525B;font-size:20px}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:18px;border:1px solid #A1A1AA;font-size:14px;background:#fff;font-family:inherit;color:#18181B;white-space:nowrap}
.debt{background:#FFF7ED;border:1px solid #FDBA74;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F5;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#18181B;display:flex;flex-direction:column;overflow:hidden">
<div class="bar"><button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><span>Take payment</span></div>
<div style="flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
<div class="card" style="text-align:center"><div class="muted">Bill total</div><div style="font-size:30px;font-weight:800">25,000.00</div></div>
<p class="sec">Customer</p>
<div class="card r"><div><div style="font-weight:600">Ravi K.</div><div class="muted">+00 98765 43210 · owes 0.00 now</div></div><a href="#">Change</a></div>
<p class="sec">How is the customer paying?</p>
<div class="card" style="display:flex;flex-direction:column;gap:10px">
<div class="pay"><div><label class="lbl" for="p1">Paid into</label><select class="inp" id="p1"><option>Cash drawer</option></select></div><div><label class="lbl" for="p2">Amount</label><input class="inp" id="p2" value="15,000.00"></div><button class="x" aria-label="Remove">×</button></div>
<div class="pay"><div><label class="lbl" for="p3">Paid into</label><select class="inp" id="p3"><option>Bank / UPI</option></select></div><div><label class="lbl" for="p4">Amount</label><input class="inp" id="p4" value="5,000.00"></div><button class="x" aria-label="Remove">×</button></div>
<div style="display:flex;gap:8px"><button class="chip">+ Another method</button><button class="chip">Pay full in cash</button></div>
</div>
<div class="debt">
<div class="r"><span>Paid now</span><b>20,000.00</b></div>
<div class="r" style="font-size:17px"><b>Left to pay (debt)</b><b style="color:#9A3412">5,000.00</b></div>
<div class="muted" style="color:#7C2D12">This 5,000.00 will be added to Ravi K.'s balance. The customer will owe you 5,000.00.</div>
<div><label class="lbl" for="p5">Promise to pay by (optional)</label><input class="inp" id="p5" value="06 Nov 2026"></div>
</div>
</div>
<div style="padding:12px 16px;background:#fff;border-top:1px solid #D4D4D8;display:flex;gap:8px"><button class="btn">Finish sale</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() { return {}; }
}
</script>
</body>
</html>
