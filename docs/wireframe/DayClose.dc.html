<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day close</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.bar{height:56px;flex:none;background:#fff;border-bottom:1px solid #D4D4D8;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;font-size:18px;font-weight:600}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#18181B}
.card{background:#fff;border:1px solid #D4D4D8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.lbl{font-size:13px;color:#3F3F46;display:block;margin-bottom:4px;font-weight:500}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #A1A1AA;border-radius:8px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:#18181B}
.big{height:64px;font-size:28px;font-weight:700;text-align:center}
.muted{color:#52525B;font-size:13px}
.short{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.btn{height:52px;border:0;border-radius:10px;background:#1D4ED8;color:#fff;font:inherit;font-size:16px;font-weight:700;flex:1}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F5;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#18181B;display:flex;flex-direction:column;overflow:hidden">
<div class="bar"><button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><span>Close the day</span></div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div class="card">
<div class="r"><span>Cash at opening</span><span>20,000.00</span></div>
<div class="r"><span>Cash in today</span><span>+28,300.00</span></div>
<div class="r"><span>Cash out today</span><span>−26,000.00</span></div>
<div class="r" style="font-weight:700;border-top:1px solid #E4E4E7;padding-top:6px"><span>App expects in drawer</span><span>22,300.00</span></div>
</div>
<div><label class="lbl" for="d1">Count the cash and type the total</label><input class="inp big" id="d1" value="22,100.00"></div>
<div class="short">
<div class="r" style="font-weight:700"><span>Short by</span><span style="color:#B91C1C">200.00</span></div>
<div><label class="lbl" for="d2">Reason (required when short or extra)</label><input class="inp" id="d2" value="Gave change, not noted"></div>
</div>
<div><label class="lbl" for="d3">Leave in drawer for tomorrow</label><input class="inp" id="d3" value="5,000.00"></div>
<div class="muted">The rest (17,100.00) can be moved to the bank with one tap. Once closed, the day is locked; only the owner can reopen it.</div>
</div>
<div style="padding:12px 16px;background:#fff;border-top:1px solid #D4D4D8;display:flex;gap:8px"><button class="btn">Close day and send summary</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

}
</script>
</body>
</html>
