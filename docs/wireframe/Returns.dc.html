<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.bar{height:56px;flex:none;background:#fff;border-bottom:1px solid #D4D4D8;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;font-size:18px;font-weight:600}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#18181B}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#E4E4E7;border-radius:10px;padding:3px}
.seg button{height:40px;border:0;border-radius:8px;background:none;font:inherit;font-size:14px;color:#3F3F46}
.seg button.on{background:#fff;color:#18181B;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.lbl{font-size:12px;color:#3F3F46;display:block;margin-bottom:3px;font-weight:500}
.inp{width:100%;box-sizing:border-box;height:44px;border:1px solid #A1A1AA;border-radius:8px;padding:0 10px;font:inherit;font-size:15px;background:#fff;color:#18181B}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:#fff;border:1px solid #D4D4D8;border-radius:12px;padding:4px 12px}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:40px;font-size:14px;border-top:1px solid #E4E4E7}
.chk:first-child{border-top:0}
.chk input{width:20px;height:20px;margin:0}
.sec{font-size:12px;font-weight:700;color:#3F3F46;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 0}
.ph{background:#E4E4E7;border:1px dashed #A1A1AA;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#52525B;font-size:11px;flex:1}
.rad{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
.rad input{width:20px;height:20px;margin:0}
.btn{height:52px;border:0;border-radius:10px;background:#1D4ED8;color:#fff;font:inherit;font-size:16px;font-weight:700;flex:1}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F5;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#18181B;display:flex;flex-direction:column;overflow:hidden">
<div class="bar"><button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><span>Returns and trade-ins</span></div>
<div style="flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:9px;overflow:hidden">
<div class="seg"><button>Return</button><button>Exchange</button><button class="on">Trade-in</button></div>
<div class="g2"><div><label class="lbl" for="t1">Seller (customer)</label><input class="inp" id="t1" value="Meera S."></div><div><label class="lbl" for="t2">Phone number</label><input class="inp" id="t2" value="+00 91234 56789"></div></div>
<div style="display:flex;gap:8px;height:56px"><div class="ph">+ ID card photo</div><div class="ph">+ Phone photos</div></div>
<div class="g2"><div><label class="lbl" for="t3">Model</label><input class="inp" id="t3" value="iPhone 12 64GB"></div><div><label class="lbl" for="t4">IMEI</label><input class="inp" id="t4" value="Scan IMEI"></div></div>
<p class="sec">Checks</p>
<div class="card">
<label class="chk">Screen and touch OK<input type="checkbox" checked></label>
<label class="chk">Cameras, speaker, mic OK<input type="checkbox" checked></label>
<label class="chk">Account lock removed (iCloud / Google)<input type="checkbox" checked></label>
<label class="chk">Battery health 84%<input type="checkbox" checked></label>
</div>
<div class="g2"><div><label class="lbl" for="t5">Price you pay</label><input class="inp" id="t5" value="18,000.00"></div><div><label class="lbl" for="t6">Planned selling price</label><input class="inp" id="t6" value="22,500.00"></div></div>
<div><div class="rad"><input type="radio" name="how" id="h1" checked><label for="h1">Use as part payment for a new phone</label></div><div class="rad"><input type="radio" name="how" id="h2"><label for="h2">Pay the customer now from an account</label></div></div>
</div>
<div style="padding:12px 16px;background:#fff;border-top:1px solid #D4D4D8;display:flex;gap:8px"><button class="btn">Add to stock and continue</button></div>
</div>
