name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk phone-shop-manager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phone-shop-manager
          path: phone-shop-manager.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest phone-shop-manager.apk \
            --title "Latest build" \
            --notes "Test build ${{ github.run_number }} from commit ${{ github.sha }}" \
            --prerelease
